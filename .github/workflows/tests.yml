name: Scanner tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python and dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium for dashboard browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Check dashboard JavaScript syntax
        run: node --check static/app.js

      - name: Check dashboard source filter syntax
        run: node --check static/source_filter.js

      - name: Check dashboard quote quality syntax
        run: node --check static/quote_quality.js

      - name: Test bankroll planner
        run: node tests/test_bankroll_plan.cjs

      - name: Test bookmaker source filter
        run: node tests/test_source_filter.cjs

      - name: Test quote freshness labels
        run: node tests/test_quote_quality.cjs

      - name: Test normalized market display adapter
        run: node tests/test_market_display.cjs
